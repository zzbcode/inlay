name: Bug report / 问题反馈
description: Report a reproducible problem using synthetic files / 使用合成数据报告问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请勿上传私人文件、密钥、令牌或含私人文件名的 JSON。安全问题请使用 Security → Report a vulnerability。
        Do not attach personal files, credentials or private recipe metadata. Report security issues privately.
  - type: input
    id: environment
    attributes:
      label: Browser and operating system / 浏览器与系统
      placeholder: Chromium 140, macOS / Firefox, Windows / Safari, iOS…
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App source / 使用方式
      description: Live URL, release filename or commit; hosted or file:// / 在线地址、离线包或提交
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps and synthetic sample / 步骤与合成样例
      description: Include carrier/payload/combined byte sizes, gap and whether a recipe was used. No private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional information / 补充说明
      description: Error text, sanitized screenshots or whether the built-in demo works.
